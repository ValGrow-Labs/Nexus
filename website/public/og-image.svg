<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background with dark mineral ground -->
  <rect width="1200" height="630" fill="#121418"/>
  <rect x="1" y="1" width="1198" height="628" stroke="#2E333D" stroke-width="2"/>

  <!-- Subtle grid dots pattern -->
  <defs>
    <pattern id="dot-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#2E333D"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dot-grid)" opacity="0.6"/>

  <!-- Decorative provenance color glow -->
  <circle cx="1020" cy="180" r="240" fill="#A78BFA" opacity="0.08" filter="blur(80px)"/>
  <circle cx="200" cy="500" r="200" fill="#38BDF8" opacity="0.05" filter="blur(70px)"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <rect width="72" height="72" rx="14" fill="#1E2129" stroke="#3A404E" stroke-width="2"/>
    <path d="M16 18H25V54H16V18Z" fill="#A78BFA"/>
    <path d="M25 25L47 47H56V43L34 21H25V25Z" fill="#818CF8"/>
    <path d="M47 18H56V54H47V18Z" fill="#C084FC"/>
  </g>

  <!-- Title & Branding -->
  <text x="195" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="34" fill="#EDF0F5" letter-spacing="-0.03em">Nexus</text>
  <text x="195" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="16" fill="#9DA2AD">By ValGrow Labs · Phase A Beta</text>

  <!-- Main Headline -->
  <text x="100" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="64" fill="#EDF0F5" letter-spacing="-0.04em">Your entire development world.</text>
  <text x="100" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="64" fill="#A78BFA" letter-spacing="-0.04em">One workspace.</text>

  <!-- Subheadline -->
  <text x="100" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="22" fill="#C4C8D1">Bring projects, AI coding agents and everyday developer tools together in a local-first environment.</text>

  <!-- Bottom Pills -->
  <g transform="translate(100, 510)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="38" rx="8" fill="#1C1F26" stroke="#2E333D"/>
    <circle cx="20" cy="19" r="4" fill="#10B981"/>
    <text x="34" y="24" font-family="ui-monospace, monospace" font-size="13" fill="#EDF0F5">8 Workspaces</text>

    <!-- Pill 2 -->
    <rect x="200" y="0" width="230" height="38" rx="8" fill="#1C1F26" stroke="#2E333D"/>
    <circle cx="220" cy="19" r="4" fill="#38BDF8"/>
    <text x="234" y="24" font-family="ui-monospace, monospace" font-size="13" fill="#EDF0F5">Claude Code &amp; Codex</text>

    <!-- Pill 3 -->
    <rect x="450" y="0" width="190" height="38" rx="8" fill="#1C1F26" stroke="#2E333D"/>
    <circle cx="470" cy="19" r="4" fill="#F59E0B"/>
    <text x="484" y="24" font-family="ui-monospace, monospace" font-size="13" fill="#EDF0F5">Local-First SQLite</text>
  </g>
</svg>

